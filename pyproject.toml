[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=3.0.0",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "readdy"
dynamic = ["version"]
description = "A particle-based reaction-diffusion simulator"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "h5py",
    "hdf5plugin",
    "pint",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://readdy.github.io"
Repository = "https://github.com/readdy/readdy"

[tool.scikit-build]
minimum-version = "0.10"
experimental = true
cmake.build-type = "Release"
wheel.packages = ["wrappers/python/src/python/readdy"]
cmake.args = [
    "-DREADDY_BUILD_PYTHON_WRAPPER=ON",
    "-DREADDY_CREATE_TEST_TARGET=OFF",
    "-DREADDY_BUILD_MPI_KERNEL=OFF",
]

[tool.scikit-build.metadata]
version.provider = "scikit_build_core.metadata.setuptools_scm"
version.provider-path = "."

[tool.setuptools-scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
